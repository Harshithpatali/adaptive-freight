services:
  - type: web
    name: adaptive-freight-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:APP --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    renderSubdomainPolicy: enabled
    autoDeployTrigger: commit
    envVars:
      - key: ROUTER_URL
        value: https://router.project-osrm.org
      - key: PUBLIC_ROUTER_FALLBACK
        value: "true"
      - key: DEMO_ORDER_STREAM
        value: "true"
      - key: PERSISTENCE_ENABLED
        value: "false"
      - key: CHECKPOINT_INTERVAL_S
        value: "0"
      - key: LIVE_ORDER_STREAM
        value: "false"
      - key: LIVE_ORDER_INTERVAL_S
        value: "30"
      - key: WS_STATE_INTERVAL_S
        value: "2"
      - key: WS_MAX_CLIENTS
        value: "3"
      - key: SIM_MINUTES_PER_SECOND
        value: "2.0"
      - key: ENGINE_TICK_MS
        value: "200"
      - key: MAX_ORDERS_PER_TICK
        value: "50"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEYS
        sync: false

