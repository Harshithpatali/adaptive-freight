services:
  - type: web
    name: adaptive-freight-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:APP --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-freight-db
          property: connectionString
      - key: ROUTER_URL
        value: https://router.project-osrm.org
      - key: PUBLIC_ROUTER_FALLBACK
        value: "true"
      - key: DEMO_ORDER_STREAM
        value: "true"
      - key: PERSISTENCE_ENABLED
        value: "false"
      - key: CHECKPOINT_INTERVAL_S
        value: "0"
      - key: LIVE_ORDER_STREAM
        value: "true"
      - key: LIVE_ORDER_INTERVAL_S
        value: "15"
      - key: SIM_MINUTES_PER_SECOND
        value: "2.0"
      - key: ENGINE_TICK_MS
        value: "200"
      - key: MAX_ORDERS_PER_TICK
        value: "50"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEYS
        sync: false

  - type: web
    name: adaptive-freight-ui
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements-frontend.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS false
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: adaptive-freight-api
          property: hostport
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: adaptive-freight-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: DASHBOARD_API_KEY
        sync: false

databases:
  - name: adaptive-freight-db
    region: singapore
    plan: 0.5c-1g
    databaseName: freight
    user: freight
    ipAllowList: []
