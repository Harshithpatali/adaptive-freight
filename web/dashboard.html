<!doctype html>
<html><head><meta charset="utf-8"><title>Adaptive Freight — Real-Time Control Tower</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b1220;--panel:#101a2e;--panel2:#0d1626;--line:#1e2c46;--fg:#eaf0ff;--muted:#8ea0c2;--accent:#00d4ff;--good:#62e6a2;--warn:#ffb86b;--bad:#ff6b6b}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh} header{display:flex;align-items:center;gap:18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;white-space:nowrap} header .sub{color:var(--muted);font-size:12px} #kpis{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:72px;text-align:center}.kpi b{display:block;font-size:16px}.kpi span{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
#status-dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px;transition:background .2s} #status-dot.live{background:var(--good)}
main{display:grid;grid-template-columns:250px 1fr 300px;gap:0;min-height:0} aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow-y:auto} aside.right{border-right:none;border-left:1px solid var(--line)}
aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}.row2{display:flex;gap:8px;margin-bottom:10px}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12px;flex:1;transition:.15s}button:hover{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);color:#05131f;border-color:var(--accent);font-weight:600}
label{display:block;color:var(--muted);font-size:11px;margin:10px 0 4px}select,input[type=range]{width:100%}.info-line{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.info-line b{color:var(--fg)}#map{width:100%;height:100%}.event{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}.event b{color:var(--accent)}.event .msg{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:11.5px}th,td{text-align:left;padding:4px 3px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}
.real{color:var(--good)}.fallback{color:var(--warn)}.pill{padding:1px 6px;border-radius:8px;font-size:10px}.pill.enroute{background:#123b2c;color:var(--good)}.pill.idle{background:#26314a;color:var(--muted)}.pill.broken{background:#3b1414;color:var(--bad)}
</style></head>
<body><div id="app">
<header><span id="status-dot"></span><h1>🚚 Adaptive Freight — Real-Time Control Tower</h1><span class="sub" id="simtime">connecting…</span><div id="kpis"></div></header>
<main>
<aside id="left"><h2>Engine</h2><div class="row2"><button class="primary" onclick="act('/control/start','post')">▶ LIVE</button><button onclick="act('/control/pause','post')">⏸ PAUSE</button></div>
<div class="row2"><button onclick="act('/control/reset','post')">↻ RESET</button></div>
<label>Simulation speed: <b id="speedval">2</b>x sim-min/sec</label><input type="range" id="speed" min="0" max="7" step="1" value="1" oninput="speedChange(this.value)">
<h2 style="margin-top:18px">Network</h2><label>Traffic factor: <b id="trafficval">1.0</b>x</label><input type="range" id="traffic" min="0" max="5" step="1" value="2" oninput="document.getElementById('trafficval').textContent=trafficLevels[this.value]">
<div class="row2"><button onclick="applyTraffic()">Apply traffic</button></div>
<h2 style="margin-top:18px">Disruption</h2><select id="vehicleSelect"></select><div class="row2" style="margin-top:8px"><button onclick="act('/disruptions/breakdown/'+vehicleSelect.value,'post')">Break</button><button onclick="act('/disruptions/repair/'+vehicleSelect.value,'post')">Repair</button></div>
<h2 style="margin-top:18px">Live Order Stream</h2><div class="info-line"><span>Status</span><b id="ls-status">–</b></div><label>Interval: <b id="ls-interval">25</b>s</label><input type="range" id="lsInterval" min="5" max="120" step="5" value="25" oninput="document.getElementById('ls-interval').textContent=this.value" onchange="act('/control/live-stream-interval/'+this.value,'post')">
<div class="row2" style="margin-top:8px"><button onclick="act('/control/live-stream/enable','post')">Enable</button><button onclick="act('/control/live-stream/disable','post')">Disable</button></div>
<h2 style="margin-top:18px">Router</h2><div class="info-line"><span>Endpoint</span><b id="r-url" style="font-size:10px;word-break:break-all"></b></div><div class="info-line"><span>Quality</span><b id="r-quality"></b></div><div class="info-line"><span>Circuit</span><b id="r-circuit"></b></div>
</aside>
<div id="map"></div>
<aside class="right"><h2>Fleet</h2><table id="fleetTable"><thead><tr><th>ID</th><th>Status</th><th>Load</th><th>Route</th></tr></thead><tbody></tbody></table><h2 style="margin-top:16px">Event Stream</h2><div id="events"></div></aside>
</main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function getApiKey(){let k=localStorage.getItem('af_api_key');if(k===null){k=window.prompt('API key (leave blank if this server has no API_KEYS configured):','')||'';localStorage.setItem('af_api_key',k)}return k}
function authHeaders(){const k=getApiKey();return k?{'X-API-Key':k}:{}}
const speedLevels=[0.5,1,2,5,10,20,50,100], trafficLevels=[0.6,0.8,1.0,1.25,1.5,2.0];document.getElementById('speedval').textContent=speedLevels[1]
const cityCoords={},map=L.map('map',{preferCanvas:true}).setView([38,-96],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map)
const routes=new Map(),markers=new Map(),stops=new Map(),palette=['#00d4ff','#ff4d6d','#7cff6b','#ffb84d','#b58cff','#00e5a8','#ffd166','#9bf6ff','#f72585','#90be6d','#f9844a','#43aa8b'];
function colorFor(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return palette[h%palette.length]}
function popup(v){return `<b>${v.vehicle_id}</b><br>${v.type}<br>Status: ${v.status}<br>Load: ${v.load_kg}/${v.capacity_kg} kg<br>Utilization: ${v.utilization_pct}%<br>Route: <span class="${v.route_quality==='real'?'real':'fallback'}">${v.route_quality}</span>`}
async function act(path,method){try{await fetch(path,{method:method.toUpperCase(),headers:authHeaders()})}catch(e){}}
function speedChange(idx){const v=speedLevels[idx];document.getElementById('speedval').textContent=v;act('/control/speed/'+v,'post')}
function applyTraffic(){const v=trafficLevels[document.getElementById('traffic').value];act('/control/traffic/'+v,'post')}
let lastVehicleIds='';
function updateKpis(s){document.getElementById('simtime').textContent='Sim time '+s.sim_time.slice(11,19)+' · '+(s.running?'running':'paused');const m=s.metrics;const items=[['Processed',s.orders_processed],['Consolidated',m.consolidated],['Dispatches',m.dispatched],['Queued',s.queue_depth],['At risk',m.at_risk||0],['Util',m.fleet_utilization+'%'],['p95',m.optimizer_p95_ms+'ms']];document.getElementById('kpis').innerHTML=items.map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');document.getElementById('r-url').textContent=s.router.url;document.getElementById('r-quality').innerHTML=`<span class="real">${s.router.real_ratio}%</span> real`;document.getElementById('r-circuit').innerHTML=s.router.circuit_open?`<span class="fallback">open, retry ${s.router.retry_in_s}s</span>`:`<span class="real">closed</span>`;if(s.live_stream){document.getElementById('ls-status').innerHTML=s.live_stream.enabled?`<span class="real">live</span>`:`<span class="fallback">off</span>`;document.getElementById('ls-interval').textContent=s.live_stream.interval_s;const slider=document.getElementById('lsInterval');if(document.activeElement!==slider)slider.value=s.live_stream.interval_s}}
function updateFleetTable(vehicles){const ids=vehicles.map(v=>v.vehicle_id).join(',');const tbody=document.querySelector('#fleetTable tbody');tbody.innerHTML=vehicles.map(v=>`<tr><td>${v.vehicle_id}</td><td><span class="pill ${v.status}">${v.status}</span></td><td>${v.load_kg.toFixed(0)}/${v.capacity_kg.toFixed(0)}</td><td class="${v.route_quality==='real'?'real':'fallback'}">${v.route_quality}</td></tr>`).join('');if(ids!==lastVehicleIds){lastVehicleIds=ids;document.getElementById('vehicleSelect').innerHTML=vehicles.map(v=>`<option value="${v.vehicle_id}">${v.vehicle_id}</option>`).join('')}}
function updateState(s){updateKpis(s);updateFleetTable(s.vehicles);for(const v of s.vehicles){if(v.status!=='enroute'||!v.geometry?.length)continue;const c=colorFor(v.vehicle_id),opts={color:c,weight:5,opacity:.9,dashArray:v.route_quality==='real'?null:'8 10'};if(routes.has(v.vehicle_id))routes.get(v.vehicle_id).setLatLngs(v.geometry).setStyle(opts);else{const p=L.polyline(v.geometry,opts).addTo(map);routes.set(v.vehicle_id,p)}if(markers.has(v.vehicle_id))markers.get(v.vehicle_id).setLatLng([v.lat,v.lon]).bindPopup(popup(v));else{const m=L.circleMarker([v.lat,v.lon],{radius:8,color:c,fillColor:c,fillOpacity:1,weight:2}).addTo(map);m.bindPopup(popup(v));markers.set(v.vehicle_id,m)}for(const st of v.route_stops||[]){const sid=`${v.vehicle_id}:${st.kind}:${st.city}:${(st.shipment_ids||[]).join(',')}`,cc=st.kind==='pickup'?'#ffd166':'#ffffff',ll=cityCoords[st.city];if(!ll)continue;if(stops.has(sid))stops.get(sid).setLatLng(ll);else{const sm=L.circleMarker(ll,{radius:6,color:c,fillColor:cc,fillOpacity:.95,weight:2}).addTo(map);sm.bindPopup(`${st.kind.toUpperCase()}<br>${st.city}`);stops.set(sid,sm)}}}for(const [id,p] of routes)if(!s.vehicles.find(v=>v.vehicle_id===id&&v.status==='enroute')){map.removeLayer(p);routes.delete(id);if(markers.has(id)){map.removeLayer(markers.get(id));markers.delete(id)}}}
function pushEvent(x){const el=document.getElementById('events'),div=document.createElement('div');div.className='event';div.innerHTML=`<b>${(x.type||'event').toUpperCase()}</b><div class="msg">${x.message||x.kind||''}</div>`;el.insertBefore(div,el.firstChild);while(el.children.length>30)el.removeChild(el.lastChild)}
function connect(){const proto=location.protocol==='https:'?'wss':'ws',k=getApiKey(),ws=new WebSocket(`${proto}://${location.host}/ws${k?'?key='+encodeURIComponent(k):''}`);ws.onopen=()=>document.getElementById('status-dot').classList.add('live');ws.onclose=()=>{document.getElementById('status-dot').classList.remove('live');setTimeout(connect,1000)};ws.onerror=()=>ws.close();ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='state')updateState(x.data);else pushEvent(x)}}
fetch('/city-coords').then(r=>r.json()).then(x=>Object.assign(cityCoords,x)).catch(()=>{});connect();
</script></body></html>
