name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render API
        env:
          RENDER_API_URL: https://adaptive-freight.onrender.com
        run: |
          set -euo pipefail
          echo "Pinging $RENDER_API_URL/health"
          curl --fail --silent --show-error             --retry 3             --retry-delay 5             --connect-timeout 10             --max-time 30             "$RENDER_API_URL/health"
          echo
          echo "Render API is reachable."
