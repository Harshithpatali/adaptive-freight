services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ROUTER_URL: http://osrm:5000
      PUBLIC_ROUTER_FALLBACK: "false"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://freight:${POSTGRES_PASSWORD}@postgres:5432/freight
      DEMO_ORDER_STREAM: ${DEMO_ORDER_STREAM:-true}
      LIVE_ORDER_STREAM: ${LIVE_ORDER_STREAM:-true}
      LIVE_ORDER_INTERVAL_S: ${LIVE_ORDER_INTERVAL_S:-15}
      SIM_MINUTES_PER_SECOND: ${SIM_MINUTES_PER_SECOND:-2.0}
      ENGINE_TICK_MS: ${ENGINE_TICK_MS:-200}
      MAX_ORDERS_PER_TICK: ${MAX_ORDERS_PER_TICK:-50}
      CHECKPOINT_INTERVAL_S: ${CHECKPOINT_INTERVAL_S:-60}
      PERSISTENCE_ENABLED: "true"
      API_KEYS: ${API_KEYS}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      osrm:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: freight
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: ["osrm-routed", "--algorithm", "mld", "/data/us-latest.osrm"]
    volumes:
      - ./osrm-data:/data:ro
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:5000/route/v1/driving/0,0;0.01,0.01?overview=false' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
